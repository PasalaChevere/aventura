<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1C0508" />
<title>Mall Aventura · Feria de Juegos</title>

<!-- ================= FIREBASE (compat, sin build) ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#1C0508;            /* rojo muy oscuro, casi negro */
    --surface:#30090F;
    --surface-2:#44101A;
    --line:#5A1A24;
    --text:#FFFFFF;
    --muted:#E3B8BE;
    --accent:#C8102E;        /* rojo Mall Aventura */
    --accent-2:#E3192F;
    --gold:#F5C400;          /* amarillo del trazo del logo */
    --radius:20px;
    --shadow:0 12px 34px rgba(0,0,0,.55);
    font-synthesis:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100%;
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
  button{font-family:inherit;cursor:pointer;border:none}
  .hidden{display:none !important}

  /* Header */
  .top{display:flex;align-items:center;gap:12px;padding:6px 2px 18px}
  .top .logo{width:64px;height:52px;flex:none;display:grid;place-items:center}
  .top .logo img{width:100%;height:100%;object-fit:contain}
  .top h1{font-size:16px;margin:0;line-height:1.1;letter-spacing:.3px;text-transform:uppercase;font-weight:800}
  .top small{color:var(--muted);font-size:12px}
  .top .right{margin-left:auto}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);
    padding:9px 13px;border-radius:12px;font-size:13px;font-weight:600}

  /* Home */
  .lead{color:var(--muted);font-size:14px;margin:2px 4px 14px;line-height:1.5}
  .section-label{display:flex;align-items:center;gap:10px;margin:22px 4px 12px}
  .section-label .txt{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text)}
  .section-label .pts{font-size:11px;color:var(--gold);background:var(--surface);border:1px solid var(--line);
    padding:4px 9px;border-radius:8px;margin-left:auto;font-weight:700}
  .section-label::before{content:"";width:3px;height:16px;background:var(--gold);border-radius:3px}
  .grid-games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .game-btn{background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:18px 14px;text-align:left;display:flex;flex-direction:column;
    gap:8px;min-height:110px;box-shadow:var(--shadow);transition:transform .08s ease,border-color .15s}
  .game-btn:active{transform:scale(.97);border-color:var(--gold)}
  .game-btn .num{width:32px;height:32px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px}
  .game-btn .gname{font-weight:800;font-size:15px;line-height:1.15}
  .game-btn .sub{color:var(--muted);font-size:12px;margin-top:auto}
  .admin-btn{width:100%;margin-top:12px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);border-radius:var(--radius);
    padding:16px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;
    justify-content:center;box-shadow:var(--shadow)}
  .admin-btn:active{border-color:var(--gold)}
  .admin-btn.gold{background:var(--gold);color:#1C0508;border-color:var(--gold);margin-top:22px}

  /* Operador */
  .game-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid var(--gold)}
  .game-head .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
  .game-head h2{margin:6px 0 0;font-size:22px}
  .teams{display:flex;flex-direction:column;gap:12px}
  .team-card{border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;
    color:#fff;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.35);transition:transform .08s ease}
  .team-card:active{transform:scale(.985)}
  .team-card .dot{width:46px;height:46px;border-radius:14px;flex:none;background:rgba(255,255,255,.25);
    display:grid;place-items:center;font-weight:900;font-size:20px}
  .team-card .info{flex:1;min-width:0}
  .team-card .tname{font-weight:800;font-size:17px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .team-card .tscore{font-size:12px;opacity:.95;margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .team-card .add{background:rgba(255,255,255,.96);color:#111;font-weight:900;font-size:15px;
    border-radius:13px;padding:12px 16px;white-space:nowrap}

  .recent{margin-top:22px}
  .recent h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 4px 10px}
  .rrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:14px}
  .rrow .rp{margin-left:auto;font-weight:800;color:var(--gold)}
  .rrow .undo{background:transparent;color:#FFB4B4;border:1px solid #9B2A3A;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700}
  .rrow .mine{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;
    padding:20px 18px calc(22px + env(safe-area-inset-bottom));border-top:4px solid var(--tcolor,#C8102E)}
  .sheet .shead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .sheet .sdot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.35)}
  .sheet h4{margin:0;font-size:18px}
  .sheet .ssub{color:var(--muted);font-size:12px}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:14px 0 12px}
  .pts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .pbtn{background:var(--surface-2);color:#fff;border:1px solid var(--line);border-radius:16px;
    padding:22px 0;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;transition:transform .06s}
  .pbtn:active{transform:scale(.95);background:var(--tcolor,#C8102E)}
  .pbtn.wide{grid-column:1 / -1}
  .otro-link{width:100%;background:transparent;color:var(--muted);padding:14px;margin-top:6px;font-size:13px;font-weight:700;text-decoration:underline}
  .manual{display:flex;gap:10px;margin-top:12px}
  .manual input{flex:1;text-align:center;font-size:20px;font-weight:800;padding:14px;border-radius:13px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
  .manual .go{background:var(--gold);color:#1C0508;font-weight:900;border-radius:13px;padding:0 22px;font-size:16px}
  .btn-cancel{width:100%;background:transparent;color:var(--muted);padding:14px;margin-top:6px;font-size:14px;font-weight:600}

  /* Admin */
  .pinwrap{max-width:340px;margin:40px auto;text-align:center}
  .pinwrap .lock{font-size:40px;margin-bottom:8px}
  .pinwrap input{width:100%;text-align:center;letter-spacing:10px;font-size:26px;font-weight:800;
    padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);margin:14px 0}
  .btn-primary{background:var(--gold);color:#1C0508;font-weight:900;font-size:17px;border-radius:14px;padding:16px;width:100%}
  .pin-err{color:#FFB4B4;font-size:13px;min-height:18px}

  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold);font-weight:800}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,196,0,.6)}70%{box-shadow:0 0 0 8px rgba(245,196,0,0)}100%{box-shadow:0 0 0 0 rgba(245,196,0,0)}}

  .dash-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
  .dash-tools button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600}
  .dash-tools button.danger{border-color:#9B2A3A;color:#FFB4B4}

  .board{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
  .brow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .brow.lead-row{border-color:var(--gold)}
  .brow .bh{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .brow .rank{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
  .brow.lead-row .rank{background:var(--gold);color:#1C0508}
  .brow .bname{font-weight:800;font-size:16px}
  .brow .btot{margin-left:auto;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold)}
  .bar{height:12px;border-radius:8px;background:var(--surface-2);overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:8px;transition:width .5s ease}

  .mtitle{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
  .matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px}
  table.matrix{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
  table.matrix th,table.matrix td{padding:11px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  table.matrix th{background:var(--surface);color:var(--muted);font-weight:700}
  table.matrix td.team{text-align:left;font-weight:800;position:sticky;left:0;background:var(--surface)}
  table.matrix th.team{position:sticky;left:0;text-align:left}
  table.matrix td.tot{font-weight:900;color:var(--gold)}
  table.matrix tr:last-child td{border-bottom:none}

  .log h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:26px 4px 10px}
  .logrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;font-size:13px}
  .logrow .lp{margin-left:auto;font-weight:800;color:var(--gold)}
  .logrow .del{background:transparent;color:#FFB4B4;border:1px solid #9B2A3A;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
  .tag{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}

  .status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--gold);color:#1C0508;
    padding:11px 20px;border-radius:999px;font-size:14px;font-weight:800;box-shadow:var(--shadow);z-index:60;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .status.show{opacity:1}

  .config-warn{background:#3a1200;border:1px solid var(--gold);color:#FFE9A8;padding:14px;border-radius:14px;font-size:13px;margin-bottom:16px;line-height:1.5}

  /* Modo presentar (admin) y pantalla publica de resultados */
  @media(min-width:600px){ body.present .wrap{max-width:900px} }
  body.present .brow .btot{font-size:30px}
  body.present .brow .bname{font-size:20px}
  body.present .top .logo{width:90px;height:72px}
  body.present .top h1{font-size:22px}
  body.present table.matrix{font-size:16px}
</style>
</head>

const CONFIGURED = !firebaseConfig.apiKey.startsWith("PEGA_");
let db=null, entriesRef=null, allEntries=[], unsub=null;

if(CONFIGURED){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs:true }).catch(()=>{});
  entriesRef = db.collection("feriaEventos").doc(EVENT_ID).collection("registros");
}

/* Identidad del celular (para que cada operador solo deshaga lo suyo) */
const DEVICE_ID = (function(){
  let id = localStorage.getItem("feria_device");
  if(!id){ id = "d-" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); localStorage.setItem("feria_device", id); }
  return id;
})();

const state = { view:"home", gameIndex:readGame(), adminOk:false };
function readGame(){ const g=localStorage.getItem("feria_game"); return g===null?null:Number(g); }
function saveGame(i){ localStorage.setItem("feria_game", i); }

function startLive(){
  if(!CONFIGURED || unsub) return;
  unsub = entriesRef.onSnapshot(snap=>{
    allEntries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    allEntries.sort((a,b)=> msOf(b.creado)-msOf(a.creado));
    render();
  }, err=>{ console.error(err); toast("Error de conexion"); });
}
function msOf(ts){ return ts&&ts.toMillis?ts.toMillis():Date.now(); }

/* Calculos */
function total(ti){ return allEntries.filter(e=>e.equipo===ti).reduce((s,e)=>s+(e.puntos||0),0); }
function totalGameTeam(gi,ti){ return allEntries.filter(e=>e.juego===gi&&e.equipo===ti).reduce((s,e)=>s+(e.puntos||0),0); }
function entriesOfGame(gi){ return allEntries.filter(e=>e.juego===gi); }
function gameIdxByType(t){ return GAMES.map((g,i)=>({g,i})).filter(x=>x.g.tipo===t).map(x=>x.i); }
function subtotalType(ti,t){ return gameIdxByType(t).reduce((s,gi)=>s+totalGameTeam(gi,ti),0); }
function catKeys(){ return Object.keys(CATEGORIES); }
function pointsOf(tipo){ return (CATEGORIES[tipo]||{points:[]}).points; }
function labelOf(tipo){ return (CATEGORIES[tipo]||{label:tipo}).label; }

/* ==================== RENDER ==================== */
const app = document.getElementById("app");
function render(){
  if(state.view==="home")    return renderHome();
  if(state.view==="game")    return renderGame();
  if(state.view==="admin")   return renderAdmin();
  if(state.view==="results") return renderResults();
}
function header(sub){
  return `<div class="top">
    <div class="logo"><img src="${LOGO}" alt="${esc(EVENT_NAME)}"></div>
    <div><h1>Feria de Juegos</h1><small>${sub||"Registro de puntajes"}</small></div>
    ${state.view!=="home"?`<div class="right"><button class="btn-ghost" onclick="goHome()">Inicio</button></div>`:""}
  </div>`;
}
function configWarn(){
  return `<div class="config-warn"><b>Falta conectar Firebase.</b> Pega tu <code>firebaseConfig</code> en la seccion de configuracion del archivo y vuelve a subirlo. Por ahora ves el diseno pero los puntos no se guardan.</div>`;
}

/* Home */
function renderHome(){
  document.body.classList.remove("present");
  const groupHTML = (idxs)=> idxs.map((gi,pos)=>`
    <button class="game-btn" onclick="openGame(${gi})">
      <div class="num">${pos+1}</div>
      <div class="gname">${esc(GAMES[gi].name)}</div>
      <div class="sub">${CONFIGURED? entriesOfGame(gi).length+" registros":"tocar para abrir"}</div>
    </button>`).join("");
  const sections = catKeys().map(t=>`
    <div class="section-label"><span class="txt">${esc(labelOf(t))}</span><span class="pts">${pointsOf(t).join(" · ")}</span></div>
    <div class="grid-games">${groupHTML(gameIdxByType(t))}</div>`).join("");
  app.innerHTML = header(EVENT_NAME) + `
    ${CONFIGURED?"":configWarn()}
    <p class="lead">Elige el juego que estas atendiendo para registrar puntos.</p>
    ${sections}
    <button class="admin-btn gold" onclick="openResults()">Ver resultados en vivo</button>
    <button class="admin-btn" onclick="openAdmin()">Panel del administrador</button>`;
}

/* Operador */
function renderGame(){
  const gi=state.gameIndex, g=GAMES[gi];
  if(!g){ state.view="home"; return renderHome(); }
  app.innerHTML = header("Estas registrando puntos") + `
    ${CONFIGURED?"":configWarn()}
    <div class="game-head">
      <div class="eyebrow">${esc(labelOf(g.tipo))}</div>
      <h2>${esc(g.name)}</h2>
    </div>
    <div class="teams">
      ${TEAMS.map((t,ti)=>`
        <div class="team-card" style="background:${t.color}" onclick="openSheet(${ti})">
          <div class="dot">${initials(t.name)}</div>
          <div class="info">
            <div class="tname">${esc(t.name)}</div>
            <div class="tscore">${totalGameTeam(gi,ti)} pts en este juego</div>
          </div>
          <div class="add">Sumar</div>
        </div>`).join("")}
    </div>
    <div class="recent"><h3>Ultimos registros de este juego</h3>${renderRecent(gi)}</div>`;
}
function renderRecent(gi){
  const list=entriesOfGame(gi).slice(0,8);
  if(!list.length) return `<div class="empty">Aun no registras puntos en este juego.</div>`;
  // Solo se puede deshacer el ultimo registro hecho desde ESTE celular en este juego
  const myLast = entriesOfGame(gi).find(e=>e.dispositivo===DEVICE_ID);
  return list.map(e=>{
    const t=TEAMS[e.equipo]||{};
    const mine = e.dispositivo===DEVICE_ID;
    return `<div class="rrow">
      <span style="width:12px;height:12px;border-radius:50%;background:${t.color};flex:none"></span>
      <span>${esc(t.name||"?")}</span>
      ${mine?`<span class="mine">tuyo</span>`:""}
      <span class="rp">+${e.puntos}</span>
      ${myLast&&e.id===myLast.id?`<button class="undo" onclick="undoEntry('${e.id}')">Deshacer</button>`:""}
    </div>`;
  }).join("");
}

/* Modal: puntos directos segun categoria */
function openSheet(ti){
  const gi=state.gameIndex, g=GAMES[gi], t=TEAMS[ti];
  const pts=pointsOf(g.tipo);
  const wide = (pts.length%2===1);
  const btns = pts.map((p,i)=>{
    const isLast=(i===pts.length-1);
    return `<button class="pbtn ${wide&&isLast?'wide':''}" onclick="quickRegister(${ti},${p})">+${p}</button>`;
  }).join("");
  const el=document.createElement("div");
  el.className="overlay"; el.id="overlay";
  el.innerHTML=`<div class="sheet" style="--tcolor:${t.color}" onclick="event.stopPropagation()">
    <div class="shead">
      <div class="sdot" style="background:${t.color}">${initials(t.name)}</div>
      <div><h4>${esc(t.name)}</h4><div class="ssub">${esc(g.name)}</div></div>
    </div>
    <div class="hint">Toca el puntaje para registrarlo</div>
    <div class="pts-grid">${btns}</div>
    <button class="otro-link" onclick="toggleManual()">Otro puntaje</button>
    <div id="manualBox" class="manual hidden">
      <input id="manualInput" type="number" inputmode="numeric" placeholder="0">
      <button class="go" onclick="manualRegister(${ti})">Sumar</button>
    </div>
    <button class="btn-cancel" onclick="closeSheet()">Cancelar</button>
  </div>`;
  el.onclick=closeSheet;
  document.body.appendChild(el);
}
function toggleManual(){ const m=document.getElementById("manualBox"); if(m){m.classList.toggle("hidden"); const i=document.getElementById("manualInput"); if(i&&!m.classList.contains("hidden"))i.focus();} }
function quickRegister(ti,p){ addEntry(ti,p); closeSheet(); }
function manualRegister(ti){ const v=parseInt(document.getElementById("manualInput").value,10); if(!v){toast("Ingresa un puntaje");return;} addEntry(ti,v); closeSheet(); }
function closeSheet(){ const o=document.getElementById("overlay"); if(o)o.remove(); }

function addEntry(ti,pts){
  if(!CONFIGURED){ toast("Conecta Firebase primero"); return; }
  const gi=state.gameIndex;
  entriesRef.add({
    juego:gi, juegoNombre:GAMES[gi].name, categoria:GAMES[gi].tipo,
    equipo:ti, equipoNombre:TEAMS[ti].name, puntos:pts,
    dispositivo:DEVICE_ID,
    creado:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>toast(`+${pts} a ${TEAMS[ti].name}`)).catch(()=>toast("No se pudo guardar"));
}
function undoEntry(id){
  const e=allEntries.find(x=>x.id===id);
  if(!e || e.dispositivo!==DEVICE_ID){ toast("Solo puedes deshacer tus propios registros"); return; }
  if(!confirm("Deshacer este ultimo registro?"))return;
  entriesRef.doc(id).delete().then(()=>toast("Registro deshecho")).catch(()=>toast("No se pudo deshacer"));
}

/* Resultados publicos (sin PIN, solo lectura) */
function renderResults(){
  document.body.classList.add("present");
  app.innerHTML = header("Resultados en vivo") + `
    ${CONFIGURED?"":configWarn()}
    <div class="live"><span class="pulse"></span> En vivo · ${allEntries.length} registros</div>
    <div style="height:14px"></div>
    ${renderBoard()}
    ${catKeys().map(t=>renderMatrix(labelOf(t),t)).join("")}`;
}

/* Admin */
function renderAdmin(){
  if(!state.adminOk) return renderPin();
  app.innerHTML = header("Panel del administrador") + `
    ${CONFIGURED?"":configWarn()}
    <div class="live"><span class="pulse"></span> En vivo · ${allEntries.length} registros</div>
    <div class="dash-tools">
      <button onclick="togglePresent()">Modo presentar</button>
      <button onclick="exportCSV()">Descargar CSV</button>
      <button class="danger" onclick="resetAllPoints()">Reiniciar puntos</button>
    </div>
    ${renderBoard()}
    ${catKeys().map(t=>renderMatrix(labelOf(t),t)).join("")}
    ${renderLog()}`;
}
function renderPin(){
  document.body.classList.remove("present");
  app.innerHTML = header("Acceso administrador") + `
    <div class="pinwrap"><div class="lock">🔒</div>
      <p class="lead">Ingresa el PIN para ver el dashboard.</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()">
      <div class="pin-err" id="pinErr"></div>
      <button class="btn-primary" onclick="checkPin()">Entrar</button>
    </div>`;
  setTimeout(()=>{const p=document.getElementById("pin"); if(p)p.focus();},50);
}
function checkPin(){ const v=document.getElementById("pin").value;
  if(v===ADMIN_PIN){state.adminOk=true;render();} else document.getElementById("pinErr").textContent="PIN incorrecto"; }

function renderBoard(){
  const ranked=TEAMS.map((t,i)=>({...t,idx:i,tot:total(i)})).sort((a,b)=>b.tot-a.tot);
  const max=Math.max(1,...ranked.map(r=>r.tot));
  return `<div class="board">${ranked.map((r,pos)=>`
    <div class="brow ${pos===0&&r.tot>0?'lead-row':''}">
      <div class="bh"><div class="rank">${pos+1}</div><div class="bname"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${r.color};margin-right:8px;vertical-align:middle"></span>${esc(r.name)}</div><div class="btot">${r.tot}</div></div>
      <div class="bar"><span style="width:${(r.tot/max)*100}%;background:${r.color}"></span></div>
    </div>`).join("")}</div>`;
}
function renderMatrix(title,tipo){
  const idxs=gameIdxByType(tipo);
  if(!idxs.length) return "";
  return `<div class="mtitle">${esc(title)}</div>
  <div class="matrix-wrap"><table class="matrix">
    <thead><tr><th class="team">Equipo</th>${idxs.map(gi=>`<th>${esc(shortName(GAMES[gi].name))}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${TEAMS.map((t,ti)=>`<tr>
      <td class="team"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${t.color};margin-right:7px"></span>${esc(t.name)}</td>
      ${idxs.map(gi=>`<td>${totalGameTeam(gi,ti)||"·"}</td>`).join("")}
      <td class="tot">${subtotalType(ti,tipo)}</td>
    </tr>`).join("")}</tbody>
  </table></div>`;
}
function renderLog(){
  const list=allEntries.slice(0,40);
  return `<div class="log"><h3>Registros recientes (correcciones)</h3>${
    list.length? list.map(e=>{const t=TEAMS[e.equipo]||{};
      return `<div class="logrow">
        <span style="width:10px;height:10px;border-radius:50%;background:${t.color};flex:none"></span>
        <span>${esc(t.name||"?")}</span><span class="tag">${esc(GAMES[e.juego]?GAMES[e.juego].name:"?")}</span>
        <span class="lp">+${e.puntos}</span>
        <button class="del" onclick="adminDelete('${e.id}')">Eliminar</button>
      </div>`;}).join("") : `<div class="empty">Sin registros todavia.</div>`
  }</div>`;
}
function adminDelete(id){ if(!confirm("Eliminar este registro? Se descuenta del total."))return;
  entriesRef.doc(id).delete().then(()=>toast("Registro eliminado")).catch(()=>toast("No se pudo eliminar")); }
function resetAllPoints(){
  if(!CONFIGURED){ toast("Conecta Firebase primero"); return; }
  if(!allEntries.length){ toast("No hay puntos que borrar"); return; }
  if(!confirm("Borrar TODOS los puntos registrados? Esto no se puede deshacer.")) return;
  if(!confirm("Confirma de nuevo: se eliminaran "+allEntries.length+" registros.")) return;
  toast("Reiniciando...");
  entriesRef.get().then(snap=>{
    const docs=snap.docs; let i=0;
    (function next(){
      if(i>=docs.length){ toast("Puntos reiniciados a cero"); return; }
      const batch=db.batch();
      docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));
      i+=400;
      batch.commit().then(next).catch(()=>toast("Error al reiniciar"));
    })();
  }).catch(()=>toast("No se pudo reiniciar"));
}
function togglePresent(){ document.body.classList.toggle("present"); }
function exportCSV(){
  const rows=[["Equipo","Juego","Categoria","Puntos","Fecha","Dispositivo"]];
  allEntries.slice().reverse().forEach(e=>{
    const d=e.creado&&e.creado.toDate?e.creado.toDate().toLocaleString("es-PE"):"";
    rows.push([e.equipoNombre||"",e.juegoNombre||"",e.categoria||"",e.puntos,d,e.dispositivo||""]);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`puntajes_${EVENT_ID}.csv`; a.click();
}

/* Nav + utils */
function goHome(){ state.view="home"; render(); }
function openGame(i){ state.gameIndex=i; saveGame(i); state.view="game"; render(); }
function openAdmin(){ state.view="admin"; render(); }
function openResults(){ state.view="results"; render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(n){ return n.trim().slice(0,2).toUpperCase(); }
function shortName(n){ return n.length>12? n.split(" ")[0] : n; }
let toastT=null;
function toast(m){ const s=document.getElementById("status"); s.textContent=m; s.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>s.classList.remove("show"),1700); }

startLive(); render();
</script>
